## Flox environment for Murder at Hollow Manor
## Docs: https://flox.dev/docs/reference/command-reference/manifest.toml/
schema-version = "1.19.0"

# Everyone gets the same Python, whatever their laptop ships with.
[install]
python.pkg-path = "python312"

# Settings, not secrets: this file is committed and can be pushed to FloxHub.
[vars]
PORT = "8666"
DAILY_BUDGET_USD = "2"
RATE_LIMIT_PER_MIN = "10"

# Secrets come from the gitignored .env, which also overrides anything in [vars].
[hook]
on-activate = '''
  if [ -f "$FLOX_ENV_PROJECT/.env" ]; then
    set -a
    . "$FLOX_ENV_PROJECT/.env"
    set +a
  fi
  if [ -z "${RUNPOD_API_KEY:-}" ]; then
    echo "🕯️  RUNPOD_API_KEY is not set. Copy .env.example to .env and add your key." >&2
  fi
'''

# Start with `flox activate --start-services`, follow with `flox services logs manor --follow`.
[services.manor]
command = 'python3 "$FLOX_ENV_PROJECT/server.py"'

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
